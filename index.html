<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Table de Pythagore</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --line: #d9d4c7;
    --head: #e8e2d4;
    --head-hl: #ffd98a;
    --sel: #3b82f6;
    --cross: #fff4d6;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --ko: #dc2626;
    --ko-bg: #fee2e2;
    --btn: #1f2430;
    --btn-ink: #ffffff;
    --key: #ffffff;
    --key-press: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --card: #1d2029;
      --ink: #eceef3;
      --muted: #9aa1ad;
      --line: #333845;
      --head: #272b36;
      --head-hl: #7a5b12;
      --sel: #60a5fa;
      --cross: #2a2717;
      --ok: #4ade80;
      --ok-bg: #12321f;
      --ko: #f87171;
      --ko-bg: #3a1618;
      --btn: #eceef3;
      --btn-ink: #14161c;
      --key: #272b36;
      --key-press: #3a3f4d;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 16px 24px;
    user-select: none; -webkit-user-select: none;
  }
  body.mobile { padding-bottom: calc(var(--kp-h, 240px) + 16px); }

  header { width: 100%; max-width: 620px; display: flex; flex-wrap: wrap;
           align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 1.3rem; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .85rem;
                padding: 6px 12px; cursor: pointer; }
  .seg button.on { background: var(--btn); color: var(--btn-ink); }

  .btn { border: 0; border-radius: 999px; background: var(--btn); color: var(--btn-ink);
         font: inherit; font-weight: 600; font-size: .9rem; padding: 7px 14px; cursor: pointer; }
  .btn:active { transform: scale(.96); }

  #status { width: 100%; max-width: 620px; display: flex; justify-content: space-between; align-items: baseline;
            font-variant-numeric: tabular-nums; margin-bottom: 8px; color: var(--muted); font-size: .95rem; }
  #timer { font-size: 1.4rem; font-weight: 700; color: var(--ink); }
  #timer.hidden { visibility: hidden; }

  #grid {
    --n: 11;
    width: 100%; max-width: 620px;
    display: grid; grid-template-columns: repeat(var(--n), 1fr);
    gap: 2px; background: var(--line); border: 2px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .c {
    aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; position: relative;
    background: var(--card); font-variant-numeric: tabular-nums;
    font-size: clamp(.8rem, 3.6vw, 1.25rem); font-weight: 600; cursor: pointer;
  }
  .c.h { background: var(--head); font-weight: 800; cursor: default; }
  .c.corner { background: var(--head); font-size: clamp(.9rem, 4vw, 1.4rem); color: var(--muted); }
  .c.h.hl { background: var(--head-hl); }
  .c.cross { background: var(--cross); }
  .c.sel { outline: 3px solid var(--sel); outline-offset: -3px; z-index: 1; }
  .c.ok { background: var(--ok-bg); color: var(--ok); }
  .c.ko { background: var(--ko-bg); color: var(--ko); }
  .c.ko .v { text-decoration: line-through; font-size: .8em; opacity: .8; }
  .c .fix { position: absolute; bottom: 1px; right: 3px; font-size: .62em; color: var(--ok); font-weight: 800; }
  .done .c:not(.h) { cursor: default; }

  #result { width: 100%; max-width: 620px; margin-top: 12px; padding: 12px 14px; border-radius: 10px;
            background: var(--card); border: 1px solid var(--line); display: none; text-align: center; }
  #result.show { display: block; }
  #result .big { font-size: 1.5rem; font-weight: 800; }
  #result .sub { color: var(--muted); margin-top: 4px; }

  .hint { color: var(--muted); font-size: .8rem; margin-top: 10px; text-align: center; max-width: 620px; }
  body.mobile .hint { display: none; }

  /* Clavier numérique mobile */
  #keypad {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    grid-template-columns: repeat(3, 1fr); gap: 6px;
  }
  body.mobile #keypad { display: grid; }
  body.mobile.done #keypad { display: none; }
  #keypad button {
    border: 1px solid var(--line); background: var(--key); color: var(--ink); border-radius: 10px;
    font: inherit; font-size: 1.45rem; font-weight: 600; height: 50px; cursor: pointer; touch-action: manipulation;
  }
  #keypad button:active { background: var(--key-press); }
  #keypad .k-ok { background: var(--btn); color: var(--btn-ink); font-size: 1.1rem; }
</style>
</head>
<body>
<header>
  <h1>✖️ Table de Pythagore</h1>
  <div class="controls">
    <div class="seg" id="mode">
      <button data-mode="timed" class="on">⏱ Chrono</button>
      <button data-mode="free">Sans temps</button>
    </div>
    <button class="btn" id="new">Nouvelle table</button>
  </div>
</header>

<div id="status">
  <span id="progress">0 / 100</span>
  <span id="timer">0:00.0</span>
</div>

<div id="grid"></div>

<div id="result"></div>

<p class="hint">Clique sur une case puis tape la réponse. Quand tout est rempli, Entrée pour corriger. Entrée / Tab ou les flèches pour changer de case, Retour arrière pour effacer.</p>

<p class="hint"><a href="archive/jeux-de-calcul.html" style="color:inherit">Anciens jeux (archive)</a></p>

<div id="keypad">
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
  <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="k-ok">Suivant ➜</button>
</div>

<script>
(() => {
  const N = 10;
  const gridEl = document.getElementById('grid');
  const timerEl = document.getElementById('timer');
  const progressEl = document.getElementById('progress');
  const resultEl = document.getElementById('result');
  const okKey = document.querySelector('#keypad [data-k="ok"]');

  // Mobile uniquement : écran tactile sans souris
  const isMobile = window.matchMedia('(pointer: coarse)').matches && !window.matchMedia('(any-pointer: fine)').matches;
  if (isMobile) document.body.classList.add('mobile');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let mode = store.get('pyth-mode') === 'free' ? 'free' : 'timed';
  let rows, cols, answers, cells, sel, startTime, tick, finished;

  const shuffle = a => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const range = () => Array.from({ length: N }, (_, i) => i + 1);

  const fmt = ms => {
    const s = ms / 1000;
    return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
  };

  function build() {
    rows = shuffle(range());
    cols = shuffle(range());
    answers = Array.from({ length: N }, () => Array(N).fill(''));
    cells = [];
    sel = null; startTime = null; finished = false;
    clearInterval(tick);
    document.body.classList.remove('done');
    resultEl.className = ''; resultEl.innerHTML = '';
    timerEl.textContent = fmt(0);
    timerEl.classList.toggle('hidden', mode === 'free');

    gridEl.innerHTML = '';
    const corner = document.createElement('div');
    corner.className = 'c h corner'; corner.textContent = '×';
    gridEl.appendChild(corner);
    cols.forEach((v, j) => {
      const d = document.createElement('div');
      d.className = 'c h'; d.textContent = v; d.dataset.col = j;
      gridEl.appendChild(d);
    });
    rows.forEach((rv, i) => {
      const h = document.createElement('div');
      h.className = 'c h'; h.textContent = rv; h.dataset.row = i;
      gridEl.appendChild(h);
      cells.push([]);
      cols.forEach((cv, j) => {
        const d = document.createElement('div');
        d.className = 'c';
        d.addEventListener('pointerdown', e => { e.preventDefault(); select(i, j); });
        gridEl.appendChild(d);
        cells[i].push(d);
      });
    });
    updateProgress();
    select(0, 0);
  }

  function select(i, j) {
    if (finished) return;
    gridEl.querySelectorAll('.sel, .hl, .cross').forEach(e => e.classList.remove('sel', 'hl', 'cross'));
    sel = [i, j];
    gridEl.querySelector(`[data-row="${i}"]`).classList.add('hl');
    gridEl.querySelector(`[data-col="${j}"]`).classList.add('hl');
    for (let k = 0; k < N; k++) {
      if (k < j) cells[i][k].classList.add('cross');
      if (k < i) cells[k][j].classList.add('cross');
    }
    cells[i][j].classList.add('sel');
    if (isMobile) {
      const r = cells[i][j].getBoundingClientRect();
      const kp = document.getElementById('keypad').getBoundingClientRect().top;
      if (r.bottom > kp - 8 || r.top < 0) cells[i][j].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function render(i, j) {
    cells[i][j].textContent = answers[i][j];
  }

  function startClock() {
    if (startTime !== null) return;
    startTime = performance.now();
    if (mode === 'timed') tick = setInterval(() => { timerEl.textContent = fmt(performance.now() - startTime); }, 100);
  }

  function filledCount() {
    return answers.flat().filter(v => v !== '').length;
  }
  function updateProgress() {
    const full = filledCount() === N * N;
    progressEl.textContent = `${filledCount()} / ${N * N}`;
    okKey.textContent = full ? 'Terminer ✓' : 'Suivant ➜';
    if (finished) return;
    resultEl.className = full ? 'show' : '';
    resultEl.innerHTML = full
      ? `<button class="btn" id="check">Terminer et corriger ✓</button>${isMobile ? '' : '<div class="sub">ou appuie sur Entrée</div>'}`
      : '';
    if (full) document.getElementById('check').addEventListener('click', finish);
  }

  function type(d) {
    if (finished || !sel) return;
    const [i, j] = sel;
    if (answers[i][j].length >= 3) return;
    startClock();
    answers[i][j] = (answers[i][j] === '0' ? '' : answers[i][j]) + d;
    render(i, j); updateProgress();
  }

  function erase() {
    if (finished || !sel) return;
    const [i, j] = sel;
    answers[i][j] = answers[i][j].slice(0, -1);
    render(i, j); updateProgress();
  }

  // Case suivante vide (lecture ligne par ligne), sinon case suivante
  function next() {
    if (finished || !sel) return;
    if (filledCount() === N * N) return finish();
    const start = sel[0] * N + sel[1];
    for (let s = 1; s <= N * N; s++) {
      const p = (start + s) % (N * N);
      if (answers[Math.floor(p / N)][p % N] === '') return select(Math.floor(p / N), p % N);
    }
    move(0, 1);
  }

  function move(di, dj) {
    if (finished || !sel) return;
    select((sel[0] + di + N) % N, (sel[1] + dj + N) % N);
  }

  function finish() {
    if (finished) return;
    finished = true;
    clearInterval(tick);
    const elapsed = startTime !== null ? performance.now() - startTime : 0;
    gridEl.querySelectorAll('.sel, .hl, .cross').forEach(e => e.classList.remove('sel', 'hl', 'cross'));
    document.body.classList.add('done');

    let good = 0;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const expected = rows[i] * cols[j];
      const c = cells[i][j];
      if (Number(answers[i][j]) === expected) {
        good++; c.classList.add('ok');
      } else {
        c.classList.add('ko');
        c.innerHTML = `<span class="v">${answers[i][j]}</span><span class="fix">${expected}</span>`;
      }
    }

    let html = `<div class="big">${good} / ${N * N} ${good === N * N ? '🎉' : ''}</div>`;
    if (mode === 'timed') {
      timerEl.textContent = fmt(elapsed);
      const t = fmt(elapsed);
      let sub = `Temps : <b>${t}</b>`;
      if (good === N * N) {
        const best = Number(store.get('pyth-best')) || 0;
        if (!best || elapsed < best) { store.set('pyth-best', String(Math.round(elapsed))); sub += ' — nouveau record !'; }
        else sub += ` — record : ${fmt(best)}`;
      }
      html += `<div class="sub">${sub}</div>`;
    }
    if (good < N * N) html += `<div class="sub">${N * N - good} erreur${N * N - good > 1 ? 's' : ''} : la bonne réponse est en vert dans la case.</div>`;
    resultEl.innerHTML = html;
    resultEl.className = 'show';
    resultEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Clavier physique (ordinateur)
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (/^[0-9]$/.test(k)) type(k);
    else if (k === 'Backspace' || k === 'Delete') erase();
    else if (k === 'Enter' || (k === 'Tab' && !e.shiftKey)) next();
    else if (k === 'ArrowRight') move(0, 1);
    else if (k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) move(0, -1);
    else if (k === 'ArrowDown') move(1, 0);
    else if (k === 'ArrowUp') move(-1, 0);
    else return;
    e.preventDefault();
  });

  // Clavier numérique (mobile uniquement)
  document.getElementById('keypad').addEventListener('pointerdown', e => {
    const b = e.target.closest('button');
    if (!b) return;
    e.preventDefault();
    const k = b.dataset.k;
    if (k === 'del') erase();
    else if (k === 'ok') next();
    else type(k);
  });

  const setKpHeight = () => {
    const h = document.getElementById('keypad').offsetHeight;
    if (h) document.body.style.setProperty('--kp-h', h + 'px');
  };
  window.addEventListener('resize', setKpHeight);

  // Modes
  const modeEl = document.getElementById('mode');
  const paintMode = () => modeEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  modeEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    store.set('pyth-mode', mode);
    paintMode();
    build();
  });

  document.getElementById('new').addEventListener('click', build);

  paintMode();
  build();
  setKpHeight();
})();
</script>
</body>
</html>
