<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>詰将棋</title>
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--accent:#e94560;--gold:#f5a623;--green:#27ae60;--blue:#2980b9;--text:#eaeaea;--dim:#888;--cell:44px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;max-width:500px;margin:0 auto;touch-action:manipulation;}

/* ── HOME ── */
#home-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--surface2);}
#home-nav h1{font-size:20px;font-weight:700;letter-spacing:1px;}
.nbtn{background:var(--surface2);color:var(--text);border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;}
#home-body{padding:20px 16px;display:flex;flex-direction:column;gap:14px;}
.mode-card{background:var(--surface);border-radius:14px;padding:20px;cursor:pointer;display:flex;align-items:center;gap:16px;border:2px solid transparent;transition:border-color .15s;}
.move-btn{background:var(--surface);border:2px solid var(--surface2);border-radius:14px;padding:18px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--text);transition:border-color .15s;}
.move-btn:active{border-color:var(--blue);}
.move-btn-title{font-size:22px;font-weight:700;}
.move-btn-count{font-size:13px;color:var(--dim);}
.mode-card:active{border-color:var(--surface2);}
.mode-card.training{border-color:#444;}
.mode-card.review{border-color:#444;}
.mode-icon{font-size:36px;flex-shrink:0;}
.mode-text{}
.mode-title{font-size:19px;font-weight:700;margin-bottom:4px;}
.mode-sub{font-size:13px;color:var(--dim);}
.due-pill{display:inline-block;background:var(--accent);color:#fff;border-radius:20px;padding:1px 9px;font-size:13px;font-weight:700;margin-left:6px;}
#home-stats{background:var(--surface);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-around;font-size:13px;}
.hstat{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hstat-val{font-size:20px;font-weight:700;}
.hstat-val.c-red{color:var(--accent);}
.hstat-val.c-blue{color:#3498db;}
.hstat-val.c-green{color:var(--green);}
.hstat-label{font-size:10px;color:var(--dim);}

/* ── STUDY ── */
#sh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--surface2);}
#bk{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;}
#timer-wrap{display:flex;flex-direction:column;align-items:flex-start;}
#timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px;}
#timer.hidden-mode{color:var(--dim);letter-spacing:4px;}
#timer.running{color:var(--gold);}
#timer.stopped{color:var(--green);}
#sh-right{flex:1;text-align:right;font-size:11px;color:var(--dim);line-height:1.5;}
#queue-badge{background:var(--surface2);border-radius:12px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--text);}

#sb{overflow-y:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px);}

#goban{display:grid;background:rgba(255,255,255,0.03);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.18);border-radius:6px;}
.cell{border:1px solid rgba(255,255,255,1);display:flex;align-items:center;justify-content:center;}
.cell.ht{background:rgba(255,196,0,0.22);box-shadow:inset 0 0 8px rgba(255,196,0,0.3);}
.cell.hf{background:rgba(100,149,255,0.18);box-shadow:inset 0 0 8px rgba(100,149,255,0.25);}
.cell.sel{background:rgba(0,255,120,0.25);box-shadow:inset 0 0 10px rgba(0,255,120,0.5);}
.cell.err{background:rgba(255,50,50,0.5)!important;transition:background 0s;}
.hp{cursor:pointer;border-radius:5px;transition:background .15s;}
.hp.sel{background:rgba(0,255,120,0.2);outline:2px solid rgba(0,255,120,0.7);}
.glbl{font-size:10px;color:var(--dim);display:flex;align-items:center;justify-content:center;}

.hands{display:flex;gap:8px;width:100%;max-width:420px;}
.hbox{flex:1;background:var(--surface);border-radius:8px;padding:7px;}
.hl{font-size:10px;color:var(--dim);margin-bottom:4px;}
.hpieces{display:flex;flex-wrap:wrap;gap:3px;min-height:20px;}
.hp{position:relative;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.hpc{position:absolute;top:-1px;right:-1px;font-size:9px;background:var(--accent);border-radius:50%;width:12px;height:12px;display:flex;align-items:center;justify-content:center;font-weight:700;}

#mnav{display:flex;gap:8px;align-items:center;}
#mnav button{background:var(--surface2);color:var(--text);border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:16px;}
#mnav button:disabled{opacity:.35;}
#mlabel{font-size:13px;color:var(--dim);min-width:120px;text-align:center;}

#sol-wrap{width:100%;max-width:420px;}
#sol-btn{width:100%;padding:14px;background:var(--surface2);color:var(--text);border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600;}

#fsrs{width:100%;max-width:420px;position:sticky;bottom:0;background:var(--bg);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);z-index:10;border-top:1px solid var(--surface2);}
.frow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.fb{padding:10px 4px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;}
.fi{font-size:10px;font-weight:400;opacity:.8;}
.fb.again{background:#c0392b;color:#fff;}.fb.hard{background:#d35400;color:#fff;}
.fb.good{background:var(--green);color:#fff;}.fb.easy{background:var(--blue);color:#fff;}

#loading{display:flex;align-items:center;justify-content:center;height:80vh;font-size:16px;color:var(--dim);}
.vol-wrap{display:flex;align-items:center;gap:4px;}
.vol-icon{background:none;border:none;font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
.vol-slider{-webkit-appearance:none;appearance:none;width:72px;height:3px;border-radius:2px;background:rgba(255,255,255,0.25);outline:none;cursor:pointer;}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;}
.vol-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:none;cursor:pointer;}
</style>
</head>
<body>
<div id="app"><div id="loading">読み込み中…</div></div>
<script>
// ── FSRS-4.5 + 3-step learning ────────────────────────────────────────────
const W=[0.4072,1.1829,3.1262,15.4722,7.2102,0.5316,1.0651,0.0589,1.5330,0.1544,1.0071,1.9395,0.1100,0.2900,2.2700,0.2500,2.9898];
const RET=0.9;
// 3 étapes avant graduation : 10min → 1jour → 3jours → FSRS
const LSTEPS=[10/(60*24), 1, 3]; // en jours

const fsrs={
  blank:()=>({state:'new',step:0,due:new Date(0).toISOString(),stability:1,difficulty:5,reps:0,lapses:0,lastReview:null}),
  fc:(t,s)=>Math.pow(1+t/(9*s),-1),
  ivl:s=>Math.max(1,Math.round(9*s*(1/RET-1))),
  initS:r=>Math.max(W[r-1],0.1),
  initD:r=>Math.min(Math.max(W[4]-Math.exp(W[5]*(r-1))+1,1),10),
  nextD(d,r){const n=d-W[6]*(r-3);return Math.min(Math.max(W[7]*W[4]+(1-W[7])*n,1),10);},
  recallS(d,s,r,g){return Math.max(s*(Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1)+1),0.1);},
  forgetS(d,s,r){return Math.max(W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp((1-r)*W[14]),0.1);},

  fmtIvl(card){
    const diff=(new Date(card.due)-Date.now())/60000;
    if(diff<60)return Math.max(1,Math.round(diff))+'m';
    if(diff<1440)return Math.round(diff/60)+'h';
    return Math.round(diff/1440)+'j';
  },

  graduate(c,rating,day){
    c.state='review'; c.step=3;
    c.difficulty=this.initD(rating); c.stability=this.initS(rating);
    c.reps++; c.due=day(Math.max(this.ivl(c.stability), rating===4?4:1));
    return c;
  },

  schedule(card,rating,now=new Date()){
    const c={...card};
    const elapsed=c.lastReview?(now-new Date(c.lastReview))/86400000:0;
    c.lastReview=now.toISOString();
    const min=m=>new Date(now.getTime()+m*60000).toISOString();
    const day=d=>new Date(now.getTime()+d*86400000).toISOString();
    const step=c.step||0;

    if(c.state==='new'||c.state==='learning'){
      if(rating===1){                          // Again → retour étape 0
        c.state='learning'; c.step=0; c.due=min(10);
      }else if(rating===2){                    // Hard → reste à l'étape
        c.state='learning'; c.step=step;
        c.due=step===0?min(10):day(LSTEPS[step]);
      }else if(rating===3){                    // Good → étape suivante
        const next=step+1;
        if(next>=3){ this.graduate(c,3,day); }
        else{ c.state='learning'; c.step=next; c.due=day(LSTEPS[next]); }
      }else{                                   // Easy → graduation directe
        this.graduate(c,4,day);
      }
    }else if(c.state==='relearning'){
      if(rating<=2){ c.step=0; c.due=min(10); }
      else{ c.state='review'; c.reps++; c.due=day(Math.max(1,this.ivl(c.stability))); }
    }else if(c.state==='review'){
      const r=this.fc(elapsed,c.stability);
      c.difficulty=this.nextD(c.difficulty,rating);
      if(rating===1){
        c.stability=this.forgetS(c.difficulty,c.stability,r);
        c.state='relearning'; c.lapses++; c.step=0; c.due=min(10);
      }else{
        c.stability=this.recallS(c.difficulty,c.stability,r,rating);
        c.reps++; c.due=day(this.ivl(c.stability));
      }
    }
    return c;
  },
  preview:card=>[1,2,3,4].map(r=>fsrs.fmtIvl(fsrs.schedule({...card},r)))
};

// ── PIECES ────────────────────────────────────────────────────────────────
const PFILE={fu:'FU',kyou:'KY',kei:'KE',gin:'GI',kin:'KI',kaku:'KA',hi:'HI',gyoku:'OU',ou:'OU',to:'TO',nkyou:'NY',nkei:'NK',ngin:'NG',uma:'UM',ryuu:'RY'};
const PKANJI={fu:'歩',kyou:'香',kei:'桂',gin:'銀',kin:'金',kaku:'角',hi:'飛',gyoku:'玉',ou:'王',to:'と',nkyou:'杏',nkei:'圭',ngin:'全',uma:'馬',ryuu:'龍'};
const PROMO={fu:'to',kyou:'nkyou',kei:'nkei',gin:'ngin',kaku:'uma',hi:'ryuu'};
const DEPROM={to:'fu',nkyou:'kyou',nkei:'kei',ngin:'gin',uma:'kaku',ryuu:'hi'};
const HORDER=['hi','kaku','kin','gin','kei','kyou','fu'];
const PSET=new Set(['to','nkyou','nkei','ngin','uma','ryuu']);

function psvg(piece,player,size){
  const k=PKANJI[piece]||'?',pr=PSET.has(piece);
  const glow=pr
    ?'0 0 1px #ff4444,0 0 5px #ff3333,0 0 12px rgba(255,60,60,0.7)'
    :'0 0 1px #00cfff,0 0 5px #00aaff,0 0 12px rgba(0,180,255,0.6)';
  const fs=Math.round(size*0.76);
  const rot=player==='gote'?'display:inline-block;transform:rotate(180deg);':'';
  return`<span style="font-size:${fs}px;color:#fff;text-shadow:${glow};${rot}line-height:1;font-weight:700;font-family:'Hiragino Mincho ProN','Noto Serif JP',serif;user-select:none">${k}</span>`;
}
function pieceHTML(cell,size=38){
  if(!cell)return'';
  return psvg(cell.piece,cell.player,size);
}

// ── BOARD LOGIC ───────────────────────────────────────────────────────────
const COL_NUM={'１':1,'２':2,'３':3,'４':4,'５':5,'６':6,'７':7,'８':8,'９':9};
const ROW_IDX={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'七':6,'八':7,'九':8};
const cpB=b=>b.map(r=>r.map(c=>c?{...c}:null));
const cpH=h=>({...h});

function applyMove(m,board,gH,sH,lastTo){
  const mv=m.move,isSame=mv.startsWith('同'),isDrop=mv.includes('打');
  const promotes=mv.includes('成')&&!['成香','成桂','成銀'].some(p=>mv.startsWith(p));
  let toR=-1,toC=-1;
  if(isSame&&lastTo){toR=lastTo[0];toC=lastTo[1];}
  else{const cn=COL_NUM[mv[0]],ri=ROW_IDX[mv[1]];if(cn!==undefined)toC=9-cn;if(ri!==undefined)toR=ri;}
  const fromR=m.from_row??-1,fromC=m.from_col??-1;
  if(isDrop){
    const player=m.num%2===1?'sente':'gote';
    const K2P={'歩':'fu','香':'kyou','桂':'kei','銀':'gin','金':'kin','角':'kaku','飛':'hi'};
    for(const[k,v]of Object.entries(K2P)){if(mv.includes(k)){board[toR][toC]={piece:v,player};const h=player==='sente'?sH:gH;if(h[v]>0)h[v]--;break;}}
  }else if(fromR>=0&&fromC>=0&&toR>=0&&toC>=0){
    const p=board[fromR][fromC];if(!p)return[toR,toC];
    const tgt=board[toR][toC];
    if(tgt){const base=DEPROM[tgt.piece]||tgt.piece;const h=tgt.player==='gote'?sH:gH;h[base]=(h[base]||0)+1;}
    board[toR][toC]={piece:promotes&&PROMO[p.piece]?PROMO[p.piece]:p.piece,player:p.player};
    board[fromR][fromC]=null;
  }
  return[toR,toC];
}

function buildStates(tsume){
  const states=[];
  let board=cpB(tsume.board),gH=cpH(tsume.gote_hand||{}),sH=cpH(tsume.sente_hand||{});
  let lastTo=null;
  states.push({board:cpB(board),gH:cpH(gH),sH:cpH(sH),lastTo:null,moveFrom:null,label:'初期配置',num:0});
  for(const m of tsume.moves){
    const isDrop=m.move.includes('打');
    const fromR=isDrop?-1:(m.from_row??-1),fromC=isDrop?-1:(m.from_col??-1);
    lastTo=applyMove(m,board,gH,sH,lastTo);
    states.push({board:cpB(board),gH:cpH(gH),sH:cpH(sH),lastTo:lastTo?[...lastTo]:null,moveFrom:fromR>=0?[fromR,fromC]:null,label:m.move,num:m.num});
  }
  return states;
}

// ── THUMBNAIL ─────────────────────────────────────────────────────────────
function makeThumbnail(tsume){
  const{board,bbox}=tsume;
  if(!bbox)return'<svg width="56" height="56"><rect width="56" height="56" fill="#333" rx="4"/></svg>';
  const{min_row,max_row,min_col,max_col}=bbox;
  const rows=max_row-min_row+1,cols=max_col-min_col+1;
  const cs=Math.max(5,Math.min(11,Math.floor(56/Math.max(rows,cols))));
  let out=`<svg width="${cols*cs}" height="${rows*cs}" viewBox="0 0 ${cols*cs} ${rows*cs}">`;
  for(let r=min_row;r<=max_row;r++)for(let c=min_col;c<=max_col;c++){
    const x=(c-min_col)*cs,y=(r-min_row)*cs;
    out+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/>`;
    const cell=board[r]?.[c];
    if(cell){
      const k=PKANJI[cell.piece]||'?',pr=PSET.has(cell.piece);
      const fill=pr?'#ff6b6b':'#e8e8e8';
      const rot=cell.player==='gote'?`rotate(180,${x+cs/2},${y+cs/2})`:'';
      out+=`<g transform="${rot}"><text x="${x+cs/2}" y="${y+cs*0.78}" text-anchor="middle" font-size="${cs*0.62}px" fill="${fill}" font-family="serif" font-weight="bold">${k}</text></g>`;
    }
  }
  return out+'</svg>';
}

// ── STORAGE ───────────────────────────────────────────────────────────────
const KEY='tsume_fsrs_v1',TKEY='tsume_times_v1';
let progress=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{};}catch{return{};}})();
let bestTimes=(()=>{try{return JSON.parse(localStorage.getItem(TKEY))||{};}catch{return{};}})();
const save=()=>localStorage.setItem(KEY,JSON.stringify(progress));
const saveT=()=>localStorage.setItem(TKEY,JSON.stringify(bestTimes));

// ── STATE ─────────────────────────────────────────────────────────────────
let data=[],st=null,tickID=null,t0=null,elapsed=0;

function getStatus(id){
  const c=progress[id];
  if(!c||c.state==='new')return'new';
  if(new Date(c.due)<=new Date())return'due';
  if(c.state==='review'&&c.reps>=4)return'mastered';
  return'learning';
}
const fmtMs=ms=>{const s=Math.floor(ms/1000),m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}.${Math.floor((ms%1000)/100)}`;};

// ── HOME ──────────────────────────────────────────────────────────────────
function renderHome(){
  const due=data.filter(t=>getStatus(t.id)==='due').length;
  const mastered=data.filter(t=>getStatus(t.id)==='mastered').length;
  const rated=data.filter(t=>progress[t.id]&&progress[t.id].state!=='new').length;
  document.getElementById('app').innerHTML=`
    <div id="home-nav"><h1>詰将棋</h1>${volHTML()}<button class="nbtn" onclick="resetAll()">リセット</button></div>
    <div id="home-body">
      <div class="mode-card training" onclick="showMoveSelect()">
        <div class="mode-icon">🆕</div>
        <div class="mode-text">
          <div class="mode-title">Nouveau problème</div>
          <div class="mode-sub">Choisir le nombre de coups</div>
        </div>
      </div>
      <div class="mode-card review" onclick="startReview()">
        <div class="mode-icon">📚</div>
        <div class="mode-text">
          <div class="mode-title">Révision${due?`<span class="due-pill">${due}</span>`:''}
          </div>
          <div class="mode-sub">${due?`${due} carte${due>1?'s':''} à réviser`:'Aucune carte due aujourd\'hui'}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="goto-input" type="number" min="1" max="${data.length}" placeholder="N° du problème…"
          style="flex:1;padding:12px 14px;background:var(--surface);border:2px solid var(--surface2);border-radius:10px;color:var(--text);font-size:15px;outline:none"
          onkeydown="if(event.key==='Enter')gotoNum()">
        <button onclick="gotoNum()" style="padding:12px 18px;background:var(--surface2);color:var(--text);border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600">→</button>
      </div>
      <div id="home-stats">
        <div class="hstat"><span class="hstat-val c-red">${due}</span><span class="hstat-label">À réviser</span></div>
        <div class="hstat"><span class="hstat-val c-blue">${rated-mastered}</span><span class="hstat-label">En cours</span></div>
        <div class="hstat"><span class="hstat-val c-green">${mastered}</span><span class="hstat-label">Maîtrisés</span></div>
        <div class="hstat"><span class="hstat-val" style="color:var(--dim)">${data.length}</span><span class="hstat-label">Total</span></div>
      </div>
    </div>`;
}

function restartProblem(){
  if(!st)return;
  if(tickID){clearInterval(tickID);tickID=null;}
  elapsed=0;t0=Date.now();
  const mf=st.moveFilter;
  st={tsume:st.tsume,states:buildStates(st.tsume),step:0,card:st.card,shown:false,mode:st.mode,queue:st.queue,moveFilter:mf,sel:null};
  if(st.mode==='review'){
    tickID=setInterval(()=>{elapsed=Date.now()-t0;const el=document.getElementById('timer');if(el)el.textContent=fmtMs(elapsed);},100);
  }
  renderStudy();
}

function gotoNum(){
  const v=parseInt(document.getElementById('goto-input')?.value);
  const t=data.find(t=>t.id===v);
  if(!t){const el=document.getElementById('goto-input');if(el){el.style.borderColor='var(--accent)';setTimeout(()=>el.style.borderColor='var(--surface2)',800);}return;}
  openStudy(t.id,'training',[]);
}

// ── TRAINING ──────────────────────────────────────────────────────────────
function validTsume(t){return t.moves.length>0&&!t.moves.some(m=>m.move==='中断');}

function showMoveSelect(){
  const counts=[...new Set(data.filter(validTsume).map(t=>t.moves.length))].sort((a,b)=>a-b);
  document.getElementById('app').innerHTML=`
    <div id="home-nav">
      <button class="nbtn" onclick="renderHome()">←</button>
      <h1>Nouveau problème</h1>
      <span></span>
    </div>
    <div id="home-body">
      <div style="font-size:13px;color:var(--dim);margin-bottom:4px">Choisissez le nombre de coups :</div>
      ${counts.map(n=>{
        const total=data.filter(t=>validTsume(t)&&t.moves.length===n).length;
        return`<button class="move-btn" onclick="startTraining(${n})">
          <span class="move-btn-title">${n}手詰</span>
          <span class="move-btn-count">${total} problème${total>1?'s':''}</span>
        </button>`;
      }).join('')}
    </div>`;
}

function startTraining(n){
  const pool=data.filter(t=>validTsume(t)&&t.moves.length===n);
  if(!pool.length)return;
  const t=pool[Math.floor(Math.random()*pool.length)];
  st={...st||{},moveFilter:n};
  openStudy(t.id,'training',[]);
}

// ── REVIEW ────────────────────────────────────────────────────────────────
function startReview(){
  const queue=data
    .filter(t=>getStatus(t.id)==='due')
    .sort((a,b)=>new Date(progress[a.id]?.due||0)-new Date(progress[b.id]?.due||0))
    .map(t=>t.id);
  if(!queue.length){
    alert('Aucune carte à réviser pour l\'instant !');return;
  }
  openStudy(queue[0],'review',queue.slice(1));
}

// ── STUDY ─────────────────────────────────────────────────────────────────
function openStudy(id,mode,queue){
  const tsume=data.find(t=>t.id===id);if(!tsume)return;
  if(tickID){clearInterval(tickID);tickID=null;}
  elapsed=0;t0=Date.now();
  const mf=st?.moveFilter;
  st={tsume,states:buildStates(tsume),step:0,card:progress[id]||fsrs.blank(),shown:false,mode,queue,moveFilter:mf,sel:null};
  if(mode==='review'){
    tickID=setInterval(()=>{elapsed=Date.now()-t0;const el=document.getElementById('timer');if(el)el.textContent=fmtMs(elapsed);},100);
  }
  renderStudy();
}

function renderStudy(){
  const{tsume,states,step,card,shown,mode,queue}=st;
  const s=states[step],ivls=fsrs.preview(card);
  const bt=bestTimes[tsume.id];

  // Header right content
  const nMoves=tsume.moves.length;
  const src=tsume.source||'';
  let rightHTML=`<span style="font-weight:700;color:var(--text)">No.${tsume.id} &nbsp;${nMoves}手詰</span>`;
  if(src) rightHTML+=`<br>${src}`;
  if(mode==='review'&&queue.length>0) rightHTML+=`<br><span id="queue-badge">${queue.length} restant${queue.length>1?'s':''}</span>`;
  else if(bt&&shown) rightHTML+=`<br>ベスト: ${fmtMs(bt)}`;

  // Timer display
  let timerClass='', timerText='';
  if(mode==='training'){
    timerClass=shown?'stopped':'hidden-mode';
    timerText=shown?fmtMs(elapsed):'● ● ●';
  }else{
    timerClass=shown?'stopped':'running';
    timerText=fmtMs(elapsed);
  }

  document.getElementById('app').innerHTML=`
    <div id="sh">
      <button id="bk" onclick="goHome()">←</button>
      <div id="timer" class="${timerClass}">${timerText}</div>
      <div id="sh-right">${rightHTML}</div>
      ${volHTML()}
    </div>
    <div id="sb">
      <div id="gw">${gobanHTML(s,tsume)}</div>
      <div class="hands" id="hw">${handHTML(s.gH,'gote')}${handHTML(s.sH,'sente')}</div>
      <div id="mnav">
        <button onclick="stepNav(-1)"${step===0?' disabled':''}>◀</button>
        <span id="mlabel">${step===0?'初期配置':`${s.num}手目: ${s.label}`}</span>
        <button onclick="stepNav(1)"${step===states.length-1?' disabled':''}>▶</button>
      </div>
      <div id="sol-wrap">
        ${!shown
          ?`<button id="sol-btn" onclick="showSol()">解答を見る ▼</button>`
          :''}
        <button onclick="restartProblem()" style="width:100%;padding:10px;background:var(--surface2);color:var(--dim);border:none;border-radius:10px;font-size:13px;cursor:pointer;margin-top:6px">↺ Recommencer</button>
      </div>
      ${shown&&st.fsrsReady!==false?`<div id="fsrs">
        ${(card.step||0)<3?`<div style="text-align:center;font-size:12px;color:var(--dim);margin-bottom:4px">Étape ${(card.step||0)+1}/3 avant graduation</div>`:''}
        <div class="frow">
          <button class="fb again" onclick="rate(1)">Again<span class="fi">${ivls[0]}</span></button>
          <button class="fb hard"  onclick="rate(2)">Hard<span class="fi">${ivls[1]}</span></button>
          <button class="fb good"  onclick="rate(3)">Good<span class="fi">${ivls[2]}</span></button>
          <button class="fb easy"  onclick="rate(4)">Easy<span class="fi">${ivls[3]}</span></button>
        </div></div>`:''}
    </div>`;
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────
function handHTML(h,player){
  const label=player==='sente'?'先手':'後手';
  let inner='';
  for(const p of HORDER){const n=h[p]||0;if(n>0){const click=player==='sente'?`onclick="handClick('${p}')" data-piece="${p}"`:'';inner+=`<div class="hp" ${click}>${pieceHTML({piece:p,player},26)}${n>1?`<span class="hpc">${n}</span>`:''}</div>`;}}
  if(!inner)inner='<span style="color:#555;font-size:11px">なし</span>';
  return`<div class="hbox"><div class="hl">${label}の持ち駒</div><div class="hpieces">${inner}</div></div>`;
}

const ROW_K=['一','二','三','四','五','六','七','八','九'];

function gobanHTML(state,tsume){
  const{board,lastTo,moveFrom}=state,{bbox}=tsume;
  if(!bbox)return'';
  // Étendre le bbox pour couvrir toutes les destinations de coups
  let{min_row,max_row,min_col,max_col}={...bbox};
  for(const s of (st?.states||[])){
    if(s.lastTo){const[r,c]=s.lastTo;min_row=Math.max(0,Math.min(min_row,r-1));max_row=Math.min(8,Math.max(max_row,r+1));min_col=Math.max(0,Math.min(min_col,c-1));max_col=Math.min(8,Math.max(max_col,c+1));}
    if(s.moveFrom){const[r,c]=s.moveFrom;min_row=Math.max(0,Math.min(min_row,r));max_row=Math.min(8,Math.max(max_row,r));min_col=Math.max(0,Math.min(min_col,c));max_col=Math.min(8,Math.max(max_col,c));}
  }
  const rows=max_row-min_row+1,cols=max_col-min_col+1;
  // Taille adaptative au viewport
  const avail=Math.min((window.innerWidth||390),500)-70;
  const cs=Math.min(48,Math.max(28,Math.floor(avail/cols)));
  const ps=Math.round(cs*0.84);

  // Labels colonnes (9→1 de gauche à droite)
  let colRow=`<div style="display:flex;margin-left:0;">`;
  for(let c=min_col;c<=max_col;c++) colRow+=`<div class="glbl" style="width:${cs}px;height:14px">${9-c}</div>`;
  colRow+='</div>';

  // Goban + labels lignes
  let g=`<div id="goban" style="grid-template-columns:repeat(${cols},${cs}px);grid-template-rows:repeat(${rows},${cs}px);">`;
  for(let r=min_row;r<=max_row;r++)for(let c=min_col;c<=max_col;c++){
    const isTo=lastTo&&lastTo[0]===r&&lastTo[1]===c;
    const isFrom=moveFrom&&moveFrom[0]===r&&moveFrom[1]===c;
    g+=`<div class="cell${isTo?' ht':''}${isFrom?' hf':''}" data-r="${r}" data-c="${c}" style="width:${cs}px;height:${cs}px" onclick="cellClick(${r},${c})">${pieceHTML(board[r]?.[c],ps)}</div>`;
  }
  g+='</div>';

  let rowCol=`<div style="display:flex;flex-direction:column;margin-left:3px;">`;
  for(let r=min_row;r<=max_row;r++) rowCol+=`<div class="glbl" style="height:${cs}px;width:12px">${ROW_K[r]}</div>`;
  rowCol+='</div>';

  return`<div>${colRow}<div style="display:flex">${g}${rowCol}</div></div>`;
}

function showSol(){
  if(st.sel){st.sel=null;clearSel();}
  elapsed=Date.now()-t0;
  if(tickID){clearInterval(tickID);tickID=null;}
  const id=st.tsume.id;
  if(!bestTimes[id]||elapsed<bestTimes[id]){bestTimes[id]=elapsed;saveT();}
  st.shown=true;
  st.fsrsReady=false;
  renderStudy();
  function playStep(i){
    if(i>=st.states.length){showFSRSButtons();return;}
    st.step=i;
    const ns=st.states[i];
    flyPiece(ns,()=>{applyMoveToDOM(ns);setTimeout(()=>playStep(i+1),700);});
  }
  setTimeout(()=>playStep(1),500);
}

function showFSRSButtons(){
  st.fsrsReady=true;
  if(document.getElementById('fsrs'))return;
  const {card}=st,ivls=fsrs.preview(card);
  const sb=document.getElementById('sb');if(!sb)return;
  const div=document.createElement('div');
  div.id='fsrs';
  div.innerHTML=`<button id="replay-btn" onclick="replayAnimation()" style="width:100%;padding:9px;background:var(--surface2);color:var(--text);border:none;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:8px">↺ Rejouer</button>${(card.step||0)<3?`<div style="text-align:center;font-size:12px;color:var(--dim);margin-bottom:4px">Étape ${(card.step||0)+1}/3 avant graduation</div>`:''}<div class="frow"><button class="fb again" onclick="rate(1)">Again<span class="fi">${ivls[0]}</span></button><button class="fb hard" onclick="rate(2)">Hard<span class="fi">${ivls[1]}</span></button><button class="fb good" onclick="rate(3)">Good<span class="fi">${ivls[2]}</span></button><button class="fb easy" onclick="rate(4)">Easy<span class="fi">${ivls[3]}</span></button></div>`;
  sb.appendChild(div);
  setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),50);
}

function replayAnimation(){
  if(animating)return;
  animating=true;
  st.step=0;
  updateGoban();
  function playStep(i){
    if(i>=st.states.length){animating=false;return;}
    st.step=i;
    const ns=st.states[i];
    flyPiece(ns,()=>{applyMoveToDOM(ns);setTimeout(()=>playStep(i+1),700);});
  }
  setTimeout(()=>playStep(1),500);
}

let animating=false;

// Sons de déplacement (volume max, indépendant du mute)
const SOUNDS=[1,2,3,4].map(n=>{const a=new Audio(`sounds/SON_${n}.mp3`);a.preload='auto';return a;});
function playMoveSound(){const a=SOUNDS[Math.floor(Math.random()*SOUNDS.length)].cloneNode();a.play().catch(()=>{});}

// Musique de fond
const BGM=new Audio('sounds/BGM.mp3');
BGM.loop=true;
let muted=false;
let bgmVol=parseFloat(localStorage.getItem('bgmVol')||'0.3');
BGM.volume=bgmVol;
function volIcon(){return muted?'🔇':'🎵';}
function toggleMute(){muted=!muted;BGM.muted=muted;document.querySelectorAll('.vol-icon').forEach(b=>b.textContent=volIcon());}
function setVolume(v){bgmVol=parseFloat(v);BGM.volume=bgmVol;BGM.muted=false;muted=false;localStorage.setItem('bgmVol',bgmVol);document.querySelectorAll('.vol-icon').forEach(b=>b.textContent=volIcon());document.querySelectorAll('.vol-slider').forEach(s=>{if(s!==document.activeElement)s.value=bgmVol;});}
function volHTML(){return`<span class="vol-wrap"><button class="vol-icon" onclick="toggleMute()">${volIcon()}</button><input class="vol-slider" type="range" min="0" max="1" step="0.01" value="${bgmVol}" oninput="setVolume(this.value)" onchange="setVolume(this.value)"></span>`;}
function startBGM(){BGM.play().catch(()=>{});document.removeEventListener('click',startBGM);document.removeEventListener('touchstart',startBGM);}
document.addEventListener('click',startBGM);
document.addEventListener('touchstart',startBGM);

document.addEventListener('visibilitychange',()=>{if(document.hidden){BGM.pause();}else if(!muted){BGM.play().catch(()=>{});}});

// Pièce volante : anime SANS reconstruire le DOM
function flyPiece(nextState,cb){
  if(!nextState.moveFrom||!nextState.lastTo){playMoveSound();applyMoveToDOM(nextState);cb();return;}
  const[fR,fC]=nextState.moveFrom,[tR,tC]=nextState.lastTo;
  const piece=nextState.board[tR]?.[tC];
  const fromCell=document.querySelector(`[data-r="${fR}"][data-c="${fC}"]`);
  const toCell=document.querySelector(`[data-r="${tR}"][data-c="${tC}"]`);
  if(!fromCell||!toCell||!piece){applyMoveToDOM(nextState);cb();return;}
  const fr=fromCell.getBoundingClientRect(),tr=toCell.getBoundingClientRect();
  const sz=fr.width-4;
  const fly=document.createElement('span');
  fly.style.cssText=`position:fixed;z-index:999;pointer-events:none;width:${sz}px;height:${sz}px;display:flex;align-items:center;justify-content:center;left:${fr.left+2}px;top:${fr.top+2}px;transition:left .28s cubic-bezier(.4,0,.2,1),top .28s cubic-bezier(.4,0,.2,1)`;
  fly.innerHTML=pieceHTML(piece,sz);
  document.body.appendChild(fly);
  fromCell.style.visibility='hidden';
  playMoveSound();
  let done=false;
  const finish=()=>{
    if(done)return;done=true;
    fly.remove();
    // Mise à jour atomique : vide la source, met à jour la destination → pas de flash
    fromCell.innerHTML='';fromCell.style.visibility='';
    applyMoveToDOM(nextState);
    cb();
  };
  setTimeout(()=>{fly.style.left=`${tr.left+2}px`;fly.style.top=`${tr.top+2}px`;},16);
  fly.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,420);
}

// Mise à jour chirurgicale : uniquement les cellules qui changent (pas de rebuild)
function applyMoveToDOM(s){
  const{board,lastTo,moveFrom,gH,sH,label,num}=s;
  const anyCell=document.querySelector('#goban .cell');
  const ps=anyCell?anyCell.offsetWidth-4:36;
  document.querySelectorAll('.cell.ht,.cell.hf').forEach(c=>c.classList.remove('ht','hf'));
  if(moveFrom){
    const[r,c]=moveFrom,cell=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    if(cell){cell.innerHTML='';cell.style.visibility='';cell.classList.add('hf');}
  }
  if(lastTo){
    const[r,c]=lastTo,cell=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
    const piece=board[r]?.[c];
    if(cell){cell.innerHTML=piece?pieceHTML(piece,ps):'';cell.classList.add('ht');}
  }
  const hw=document.getElementById('hw');if(hw)hw.innerHTML=handHTML(gH,'gote')+handHTML(sH,'sente');
  const ml=document.getElementById('mlabel');if(ml)ml.textContent=num===0?'初期配置':`${num}手目: ${label}`;
  const btns=document.querySelectorAll('#mnav button'),step=st.step;
  if(btns[0])btns[0].disabled=step===0;if(btns[1])btns[1].disabled=step===st.states.length-1;
}

function stepNav(d){
  if(animating)return;
  if(st.sel){st.sel=null;clearSel();}
  const ns=st.step+d;
  if(ns<0||ns>=st.states.length)return;
  if(d===1){
    animating=true;
    flyPiece(st.states[ns],()=>{
      animating=false;st.step=ns;
      if(ns===st.states.length-1){
        if(!st.shown){
          elapsed=Date.now()-t0;
          if(tickID){clearInterval(tickID);tickID=null;}
          const id=st.tsume.id;
          if(!bestTimes[id]||elapsed<bestTimes[id]){bestTimes[id]=elapsed;saveT();}
          st.shown=true;
          const te=document.getElementById('timer');
          if(te){te.textContent=fmtMs(elapsed);te.className='stopped';}
          const sw=document.getElementById('sol-wrap');if(sw)sw.innerHTML='';
        }
        showFSRSButtons();
      }
    });
  }else{
    st.step=ns;updateGoban();
  }
}

function updateGoban(){
  const{states,step,tsume}=st,s=states[step];
  const gw=document.getElementById('gw');if(gw)gw.innerHTML=gobanHTML(s,tsume);
  const hw=document.getElementById('hw');if(hw)hw.innerHTML=handHTML(s.gH,'gote')+handHTML(s.sH,'sente');
  const ml=document.getElementById('mlabel');if(ml)ml.textContent=step===0?'初期配置':`${s.num}手目: ${s.label}`;
  const btns=document.querySelectorAll('#mnav button');
  if(btns[0])btns[0].disabled=step===0;if(btns[1])btns[1].disabled=step===st.states.length-1;
}

function rate(r){
  const{mode,queue,tsume}=st;
  progress[tsume.id]=fsrs.schedule(st.card,r);
  save();
  // Review mode: auto-advance to next card in queue
  if(mode==='review'&&queue.length>0){
    openStudy(queue[0],'review',queue.slice(1));
  }else if(mode==='training'){
    startTraining(st.moveFilter||3);
  }else{
    goHome();
  }
}

function goHome(){
  if(tickID){clearInterval(tickID);tickID=null;}
  st=null;elapsed=0;renderHome();
}

function resetAll(){
  if(!confirm('Réinitialiser toute la progression ?'))return;
  progress={};bestTimes={};save();saveT();renderHome();
}

// ── INTERACTIVE PLAY ──────────────────────────────────────────────────────
function clearSel(){
  document.querySelectorAll('.cell.sel,.hp.sel').forEach(el=>el.classList.remove('sel'));
}
function setSel(){
  clearSel();
  if(!st?.sel)return;
  if(st.sel.hand){
    document.querySelectorAll(`.hp[data-piece="${st.sel.piece}"]`).forEach(el=>el.classList.add('sel'));
  }else{
    const c=document.querySelector(`[data-r="${st.sel.r}"][data-c="${st.sel.c}"]`);
    if(c)c.classList.add('sel');
  }
}
function cellClick(r,c){
  if(animating||!st||st.shown)return;
  if(st.step%2!==0||st.step>=st.states.length-1)return;
  const piece=st.states[st.step].board[r]?.[c];
  if(st.sel&&!st.sel.hand&&st.sel.r===r&&st.sel.c===c){st.sel=null;clearSel();return;}
  if(!st.sel){
    if(piece&&piece.player==='sente'){st.sel={r,c};setSel();}
  }else{
    if(piece&&piece.player==='sente'){st.sel={r,c};setSel();}
    else tryMove(r,c);
  }
}
function handClick(p){
  if(animating||!st||st.shown)return;
  if(st.step%2!==0||st.step>=st.states.length-1)return;
  if(st.sel?.hand&&st.sel.piece===p){st.sel=null;clearSel();return;}
  st.sel={hand:true,piece:p};setSel();
}
function tryMove(toR,toC){
  const next=st.states[st.step+1];if(!next)return;
  const expFrom=next.moveFrom,expTo=next.lastTo;
  let fromOk=false;
  if(st.sel.hand){
    fromOk=expFrom===null&&next.board[expTo?.[0]]?.[expTo?.[1]]?.piece===st.sel.piece;
  }else{
    fromOk=expFrom&&expFrom[0]===st.sel.r&&expFrom[1]===st.sel.c;
  }
  const toOk=expTo&&expTo[0]===toR&&expTo[1]===toC;
  st.sel=null;clearSel();
  if(fromOk&&toOk){
    playCorrectMove();
  }else{
    const cell=document.querySelector(`[data-r="${toR}"][data-c="${toC}"]`);
    if(cell){cell.classList.add('err');setTimeout(()=>cell.classList.remove('err'),400);}
  }
}
function playCorrectMove(){
  animating=true;
  const ns=st.states[st.step+1];
  flyPiece(ns,()=>{
    applyMoveToDOM(ns);st.step++;animating=false;
    if(st.step>=st.states.length-1){
      elapsed=Date.now()-t0;
      if(tickID){clearInterval(tickID);tickID=null;}
      const id=st.tsume.id;
      if(!bestTimes[id]||elapsed<bestTimes[id]){bestTimes[id]=elapsed;saveT();}
      st.shown=true;
      const te=document.getElementById('timer');if(te){te.textContent=fmtMs(elapsed);te.className='stopped';}
      const sw=document.getElementById('sol-wrap');if(sw)sw.innerHTML='';
      showFSRSButtons();
    }else{
      setTimeout(autoPlayGote,700);
    }
  });
}
function autoPlayGote(){
  if(animating||st.step>=st.states.length-1)return;
  animating=true;
  const ns=st.states[st.step+1];
  flyPiece(ns,()=>{
    applyMoveToDOM(ns);st.step++;animating=false;
    if(st.step>=st.states.length-1){st.shown=true;showFSRSButtons();}
  });
}

// Bloquer pinch-to-zoom sur iOS Safari
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});

fetch('tsume.json')
